services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ngo-donation-portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend-springboot:
    image: ngo-backend:latest
    environment:
      DB_URL: jdbc:postgresql://db:5432/ngo-donation-portal
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - backend-springboot

volumes:
  db-data:
