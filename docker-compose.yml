services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ngo-donation-portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs only when the volume is first initialised (the backend does not
      # create tables itself: spring.jpa.hibernate.ddl-auto=none).
      - ./ansible/roles/postgres/files/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ngo-donation-portal"]
      interval: 5s
      retries: 10

  backend-springboot:
    image: ngo-backend:latest
    environment:
      DB_URL: jdbc:postgresql://db:5432/ngo-donation-portal
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8091:80"
    depends_on:
      - backend-springboot

volumes:
  db-data:
