[defaults]
inventory = inventory.ini
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
callback_result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks

[ssh_connection]
# Pipelining avoids temp files on the node, which also lets become_user
# (e.g. postgres) work without granting it access to the deploy user's files.
pipelining = True
