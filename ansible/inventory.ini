# Lab node: a clean Ubuntu 24.04 container started by node/node.sh.
# To target a real VM (e.g. Oracle Cloud) instead, replace the host line with
#   ngo-vm-1 ansible_host=<public-ip> ansible_port=22 ansible_user=ubuntu
# and point ansible_ssh_private_key_file at that VM's key.
[ngo_nodes]
ngo-node-1 ansible_host=127.0.0.1 ansible_port=2222

[ngo_nodes:vars]
ansible_user=deploy
ansible_ssh_private_key_file=~/.ssh/ngo_node_ed25519
# The lab node's host key changes on every reset, so don't pin it.
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
