- name: Install base packages (JRE, PostgreSQL, Nginx and tooling)
  ansible.builtin.apt:
    name: "{{ ngo_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the tomcat service group
  ansible.builtin.group:
    name: "{{ tomcat_user }}"
    system: true

- name: Create the tomcat service account (no login shell)
  ansible.builtin.user:
    name: "{{ tomcat_user }}"
    group: "{{ tomcat_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ tomcat_home }}"
    create_home: false

- name: Create application directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ ngo_base_dir }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ ngo_releases_dir }}", owner: "{{ tomcat_user }}", group: "{{ tomcat_user }}", mode: "0755" }
    - { path: "{{ ngo_sql_dir }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ ngo_config_dir }}", owner: root, group: "{{ tomcat_user }}", mode: "0750" }
    - { path: "{{ ngo_web_root }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ tomcat_home }}", owner: root, group: root, mode: "0755" }
